name: Qimen AI UI CI

on:
  push:
    branches:
      - qimen-ai-ui
  pull_request:
    branches:
      - qimen-core-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify qimen-core contracts
        run: ./gradlew --no-daemon :qimen-core:test
      - name: Verify Android qimen input logic
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Assemble Android app
        run: ./gradlew --no-daemon :app:assembleDebug
