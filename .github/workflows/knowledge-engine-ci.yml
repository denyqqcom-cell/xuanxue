name: Knowledge Engine V1 CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-engine-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate six-domain knowledge contracts
        run: python3 tools/validate_knowledge.py
      - name: Guard knowledge tree from packaged research binaries
        shell: bash
        run: |
          set -euo pipefail
          if find knowledge -type f \( -iname '*.pdf' -o -iname '*.epub' -o -iname '*.doc' -o -iname '*.docx' -o -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print | grep -q .; then
            echo 'Forbidden research binary detected under knowledge/' >&2
            exit 1
          fi
      - name: Verify existing core still passes
        uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon :ziwei-core:test
