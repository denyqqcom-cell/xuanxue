name: Knowledge Engine V1 CI

on:
  push:
    branches:
      - main
      - knowledge-engine-v1
      - knowledge-engine-v1-k2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-engine-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate six-domain knowledge contracts
        run: python3 tools/validate_knowledge.py
      - name: Verify generated knowledge status is current
        run: python3 tools/generate_knowledge_status.py --check
      - name: Test Knowledge Engine CI contract
        run: python3 tools/test_knowledge_ci_contract.py
      - name: Test local K1 intake validator
        run: python3 tools/test_validate_k1_intake.py
      - name: Test K1 sanitization boundary
        run: python3 tools/test_k1_sanitization.py
      - name: Validate sanitized K1 import state
        run: python3 tools/validate_sanitized_k1.py
      - name: Test K1 source quality fail-closed cases
        run: python3 tools/test_k1_source_quality.py
      - name: Enforce K1 source quality state
        run: python3 tools/validate_k1_source_quality.py
      - name: Test K1 semantic routing fail-closed cases
        run: python3 tools/test_k1_semantic_routing.py
      - name: Enforce K1 semantic routing state
        run: python3 tools/validate_k1_semantic_routing.py
      - name: Test K2 source lineage fail-closed cases
        run: python3 tools/test_k2_source_lineage.py
      - name: Enforce accepted K2 lineage integrity
        run: python3 tools/validate_k2_lineage_integrity.py
      - name: Test isolated K2 dependency health gate
        run: python3 tools/test_k2_python_deps.py
      - name: Test K2 evidence fail-closed cases
        run: python3 tools/test_k2_evidence.py
      - name: Enforce K2 evidence state
        run: python3 tools/validate_k2_evidence.py
      - name: Guard knowledge tree from packaged research binaries
        shell: bash
        run: |
          set -euo pipefail
          if find knowledge -type f \( -iname '*.pdf' -o -iname '*.epub' -o -iname '*.doc' -o -iname '*.docx' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print | grep -q .; then
            echo 'Forbidden research binary detected under knowledge/' >&2
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify existing stable core still passes
        run: ./gradlew --no-daemon :ziwei-core:test

  k2-helper-portability:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated K2 dependency target
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'k2-python-deps'
          "K2_PYTHON_DEPS=$deps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "K2_PYTHON_DEPS=$deps"
      - name: Install portable K2 PDF fallback into isolated target
        shell: pwsh
        run: python -m pip install --target "$env:K2_PYTHON_DEPS" -r tools/k2_helper_requirements.txt
      - name: Test isolated dependency health gate on Windows
        run: python tools/test_k2_python_deps.py
      - name: Verify isolated K2 PDF dependency health
        shell: pwsh
        run: python tools/validate_k2_python_deps.py --python-deps-dir "$env:K2_PYTHON_DEPS"
      - name: Verify K2 local helper on Windows paths and PDF fallback
        run: python tools/test_k2_evidence.py
