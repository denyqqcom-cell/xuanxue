name: K2 Qimen Cognitive Reconstruction Gates

on:
  push:
    branches:
      - main
      - knowledge-engine-v1
      - knowledge-engine-v1-k2
    paths:
      - 'knowledge/K2_QIMEN_COGNITIVE_*'
      - 'knowledge/K2_QIMEN_SCRM_V01.md'
      - 'knowledge/K2_QIMEN_TBV_*'
      - 'knowledge/K2_QIMEN_PRACTICE_*'
      - 'knowledge/K2_QIMEN_CDAF_H2_*'
      - 'knowledge/K2_UNKNOWN_TEXTUAL_BACKLOG.json'
      - 'knowledge/K2_DEEP_READING_LEDGER.jsonl'
      - 'knowledge/K2_DEEP_SOURCE_DISTILLATES.d/**'
      - 'knowledge/K2_WORK_FAMILY_DISTILLATES.jsonl'
      - 'knowledge/schema/qimen_*'
      - 'tools/test_k2_qimen_cognitive_reconstruction.py'
      - 'tools/validate_k2_qimen_cognitive_reconstruction.py'
      - 'tools/test_k2_qimen_tbv.py'
      - 'tools/validate_k2_qimen_tbv.py'
      - 'tools/test_k2_qimen_practice_input_integrity.py'
      - 'tools/validate_k2_qimen_practice_input_integrity.py'
      - 'tools/test_k2_qimen_weather_structure_audit.py'
      - 'tools/test_k2_qimen_plate_pairing_fixture.py'
      - '.github/workflows/k2-qimen-cognitive-reconstruction.yml'
      - '.github/workflows/knowledge-engine-ci.yml'
      - 'tools/test_knowledge_ci_contract.py'
  pull_request:
    paths:
      - 'knowledge/K2_QIMEN_COGNITIVE_*'
      - 'knowledge/K2_QIMEN_SCRM_V01.md'
      - 'knowledge/K2_QIMEN_TBV_*'
      - 'knowledge/K2_QIMEN_PRACTICE_*'
      - 'knowledge/K2_QIMEN_CDAF_H2_*'
      - 'knowledge/K2_UNKNOWN_TEXTUAL_BACKLOG.json'
      - 'knowledge/K2_DEEP_READING_LEDGER.jsonl'
      - 'knowledge/K2_DEEP_SOURCE_DISTILLATES.d/**'
      - 'knowledge/K2_WORK_FAMILY_DISTILLATES.jsonl'
      - 'knowledge/schema/qimen_*'
      - 'tools/test_k2_qimen_cognitive_reconstruction.py'
      - 'tools/validate_k2_qimen_cognitive_reconstruction.py'
      - 'tools/test_k2_qimen_tbv.py'
      - 'tools/validate_k2_qimen_tbv.py'
      - 'tools/test_k2_qimen_practice_input_integrity.py'
      - 'tools/validate_k2_qimen_practice_input_integrity.py'
      - 'tools/test_k2_qimen_weather_structure_audit.py'
      - 'tools/test_k2_qimen_plate_pairing_fixture.py'
      - '.github/workflows/k2-qimen-cognitive-reconstruction.yml'
      - '.github/workflows/knowledge-engine-ci.yml'
      - 'tools/test_knowledge_ci_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cognitive-reconstruction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed cognitive reconstruction contracts
        run: python3 tools/test_k2_qimen_cognitive_reconstruction.py
      - name: Enforce current cognitive reconstruction state
        run: python3 tools/validate_k2_qimen_cognitive_reconstruction.py
      - name: Test Theory-Boundary-Validation reverse review
        run: python3 tools/test_k2_qimen_tbv.py
      - name: Enforce current Theory-Boundary-Validation state
        run: python3 tools/validate_k2_qimen_tbv.py
      - name: Test Qimen practice input-integrity fail-closed cases
        run: python3 tools/test_k2_qimen_practice_input_integrity.py
      - name: Enforce Qimen practice input-integrity contract
        run: python3 tools/validate_k2_qimen_practice_input_integrity.py
      - name: Test CDAF-H2 weather implementation structure audit
        run: python3 tools/test_k2_qimen_weather_structure_audit.py
      - name: Test source-grounded Qimen plate pairing fixture
        run: python3 tools/test_k2_qimen_plate_pairing_fixture.py
