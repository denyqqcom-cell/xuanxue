name: K2 Corpus Expansion CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k2-corpus-expansion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-expansion-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test corpus expansion gate
        run: python3 tools/test_k2_evidence_expansion.py
      - name: Enforce corpus expansion state
        run: python3 tools/validate_k2_evidence_expansion.py
      - name: Preserve claim extraction boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project=json.loads(Path('knowledge/PROJECT_STATE.json').read_text(encoding='utf-8'))
          assert project.get('claim_extraction_blocked') is True
          print('claim_extraction_blocked=true')
          PY
