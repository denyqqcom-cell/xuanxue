name: RC Emulator Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  device-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile instrumentation acceptance tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | "$AVDMANAGER" create avd \
            --name xuanxue_rc35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --force

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rc-device-acceptance
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR"
          nohup "$EMULATOR" \
            -avd xuanxue_rc35 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -accel on \
            > build/rc-device-acceptance/emulator.log 2>&1 &
          echo $! > build/rc-device-acceptance/emulator.pid
          adb wait-for-device
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 3; done'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          {
            echo "source_head_sha=${SOURCE_HEAD_SHA}"
            echo "adb=$(adb --version | head -n 1)"
            echo "api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "model=$(adb shell getprop ro.product.model | tr -d '\r')"
            echo "boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')"
          } > build/rc-device-acceptance/EMULATOR_BOOT.txt

      - name: Run narrow and wide RC acceptance
        shell: bash
        run: bash .github/scripts/run_rc_emulator_acceptance.sh

      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build/rc-device-acceptance
          adb devices -l > build/rc-device-acceptance/ADB_DEVICES.txt 2>&1 || true
          adb shell getprop > build/rc-device-acceptance/DEVICE_PROPERTIES.txt 2>&1 || true
          adb logcat -d -t 3000 > build/rc-device-acceptance/LOGCAT_TAIL.txt 2>&1 || true
          if [[ -f build/rc-device-acceptance/emulator.log ]]; then
            tail -n 1000 build/rc-device-acceptance/emulator.log > build/rc-device-acceptance/EMULATOR_LOG_TAIL.txt || true
          fi

      - name: Upload emulator acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanxue-rc1-emulator-acceptance-${{ env.SOURCE_HEAD_SHA }}
          path: |
            build/rc-device-acceptance/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
