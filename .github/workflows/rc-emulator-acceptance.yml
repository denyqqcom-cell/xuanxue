name: RC Emulator Acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  device-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run RC acceptance on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p build/rc-device-acceptance/narrow build/rc-device-acceptance/wide

            adb shell cmd connectivity airplane-mode enable || {
              adb shell settings put global airplane_mode_on 1
              adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            }
            airplane="$(adb shell settings get global airplane_mode_on | tr -d '\r')"
            test "$airplane" = "1"

            echo '=== NARROW / LIGHT ==='
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb shell cmd uimode night no
            ./gradlew --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.xuanxue.app.RcDeviceAcceptanceTest \
              -Pandroid.testInstrumentationRunnerArguments.formFactor=narrow
            adb pull /sdcard/Android/data/com.xuanxue.app.rc/files/rc-screenshots build/rc-device-acceptance/narrow/screenshots || true
            if [[ -d app/build/outputs/androidTest-results/connected ]]; then
              cp -R app/build/outputs/androidTest-results/connected build/rc-device-acceptance/narrow/test-results
            fi
            {
              echo "source_head_sha=${SOURCE_HEAD_SHA}"
              echo "form_factor=narrow"
              echo "theme=light"
              echo "airplane_mode=$(adb shell settings get global airplane_mode_on | tr -d '\r')"
              adb shell wm size
              adb shell wm density
            } > build/rc-device-acceptance/narrow/ENVIRONMENT.txt

            echo '=== WIDE / DARK ==='
            adb shell wm size 1600x1200
            adb shell wm density 240
            adb shell cmd uimode night yes
            ./gradlew --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.xuanxue.app.RcDeviceAcceptanceTest \
              -Pandroid.testInstrumentationRunnerArguments.formFactor=wide
            adb pull /sdcard/Android/data/com.xuanxue.app.rc/files/rc-screenshots build/rc-device-acceptance/wide/screenshots || true
            if [[ -d app/build/outputs/androidTest-results/connected ]]; then
              cp -R app/build/outputs/androidTest-results/connected build/rc-device-acceptance/wide/test-results
            fi
            {
              echo "source_head_sha=${SOURCE_HEAD_SHA}"
              echo "form_factor=wide"
              echo "theme=dark"
              echo "airplane_mode=$(adb shell settings get global airplane_mode_on | tr -d '\r')"
              adb shell wm size
              adb shell wm density
            } > build/rc-device-acceptance/wide/ENVIRONMENT.txt

            adb shell pm path com.xuanxue.app.rc > build/rc-device-acceptance/PACKAGE_PATH.txt
            if adb shell dumpsys package com.xuanxue.app.rc | grep -Fq 'android.permission.INTERNET'; then
              echo 'Runtime package unexpectedly declares android.permission.INTERNET' >&2
              exit 1
            fi
            echo "internet_permission=absent" > build/rc-device-acceptance/RUNTIME_SECURITY.txt
            echo "airplane_mode=1" >> build/rc-device-acceptance/RUNTIME_SECURITY.txt
            echo "source_head_sha=${SOURCE_HEAD_SHA}" >> build/rc-device-acceptance/RUNTIME_SECURITY.txt

      - name: Upload emulator acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuanxue-rc1-emulator-acceptance-${{ env.SOURCE_HEAD_SHA }}
          path: |
            build/rc-device-acceptance/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
