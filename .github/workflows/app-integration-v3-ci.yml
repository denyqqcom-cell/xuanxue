name: App Integration V3 CI

on:
  push:
    branches:
      - app-integration-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify core and evidence contracts
        run: ./gradlew --no-daemon :ziwei-core:test
      - name: Assemble Android app
        run: ./gradlew --no-daemon :app:assembleDebug
